services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      POSTGRES_DB: shop
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop"]
      interval: 2s
      retries: 20
  app:
    build: ./app
    environment:
      DATABASE_URL: postgresql://shop:shop@db:5432/shop
      BUY_MODE: ${BUY_MODE:-atomic}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
